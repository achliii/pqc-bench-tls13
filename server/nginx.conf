# PQC-Bench TLS 1.3 — configuración del servidor.
# Puerto 4433: TLS 1.3 clásico  (X25519)
# Puerto 4434: TLS 1.3 híbrido  (X25519MLKEM768; id. lógico x25519_mlkem768)
#
# Cada puerto acepta UN solo grupo: si el cliente no ofrece ese grupo el
# handshake falla, lo que permite verificar que no hay negociación cruzada.

worker_processes  auto;
error_log  /dev/stderr warn;

events {
    worker_connections  4096;
}

http {
    access_log  off;
    default_type  text/plain;

    ssl_protocols        TLSv1.3;
    ssl_certificate      /opt/nginx/pki-bench/server.crt;
    ssl_certificate_key  /opt/nginx/pki-bench/server.key;

    # Sin reanudación de sesión: cada conexión es un Full Handshake 1-RTT.
    ssl_session_tickets  off;
    ssl_session_cache    off;
    ssl_early_data       off;

    server {
        listen  4433 ssl backlog=4096;
        ssl_ecdh_curve  X25519;
        location / { return 200 "PQC-Bench CLASSIC (X25519)\n"; }
    }

    server {
        listen  4434 ssl backlog=4096;
        ssl_ecdh_curve  X25519MLKEM768;
        location / { return 200 "PQC-Bench PQC_HYBRID (X25519MLKEM768)\n"; }
    }
}
